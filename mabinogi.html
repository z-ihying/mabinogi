/* Daily checklist */
.todo-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:2px 2px 10px}.todo-top h2{font-size:22px;margin:0 0 3px}.todo-top p{font-size:12.5px;color:var(--muted);margin:0}.todo-clear{border:1px solid var(--line);background:#fffdf7;border-radius:9px;padding:7px 10px;color:#666b63;cursor:pointer}.todo-list,.weekly-list{display:grid;gap:7px}.todo-item{position:relative;display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;gap:10px;background:var(--paper);border:1px solid #d9d4c5;border-radius:12px;padding:10px 12px;cursor:pointer;box-shadow:0 4px 14px rgba(69,63,47,.045)}.todo-item.important{background:linear-gradient(90deg,#fff8d5,#fffdf7 48%);border-color:#e3d49d}.todo-item input{position:absolute;opacity:0;pointer-events:none}.todo-check{width:20px;height:20px;border:2px solid #a8aa9f;border-radius:6px;background:#fff;display:grid;place-items:center}.todo-item input:checked+.todo-check{background:#64785e;border-color:#64785e}.todo-item input:checked+.todo-check:after{content:'✓';font-size:14px;font-weight:900;color:#fff;line-height:1}.todo-item:has(input:checked) .todo-main{opacity:.48;text-decoration:line-through}.todo-main{min-width:0}.todo-main b{display:block;font-size:15px;line-height:1.25}.todo-main small{display:block;margin-top:2px;font-size:12.5px;line-height:1.4;color:#696e66}.todo-tag{font-size:11.5px;font-weight:850;border:1px solid #d9d3c5;background:#f5f1e8;border-radius:999px;padding:4px 7px;white-space:nowrap}.important .todo-tag{background:#fff0a8;border-color:#e0c763}.day-rewards{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:12px;color:#555c53}.day-rewards span{white-space:nowrap}.day-rewards i{font-style:normal;font-weight:900;color:#64785e}.day-rewards strong{font-weight:850;color:#343a34}.weekly-box{margin-top:12px;background:var(--paper);border:1px solid #d9d4c5;border-radius:14px;overflow:hidden}.weekly-box summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:11px 13px;cursor:pointer;background:#eee8dd}.weekly-box summary::-webkit-details-marker{display:none}.weekly-box summary b{display:block;font-size:16px}.weekly-box summary small{display:block;color:#777c74;font-size:11.5px;margin-top:2px}.weekly-arrow{font-size:20px;transition:.2s}.weekly-box[open] .weekly-arrow{transform:rotate(180deg)}.weekly-list{padding:8px}.weekly-list .todo-item{box-shadow:none}.weekly-list .todo-item:last-child{margin-bottom:0}@media(max-width:600px){.todo-top{align-items:flex-start}.todo-top p{max-width:250px}.todo-item{grid-template-columns:22px minmax(0,1fr) auto;padding:9px 10px;gap:8px}.todo-main b{font-size:14.5px}.todo-main small{font-size:12px}.day-rewards{font-size:11.5px}}

.coin-icon{font-style:normal;color:#d6a21f;font-size:1.15em;line-height:1;text-shadow:0 0 0 #d6a21f}.weekday-dungeon .day-rewards{display:grid;grid-template-columns:1fr;gap:3px;margin-top:6px}.weekday-dungeon .day-rewards span{display:grid;grid-template-columns:54px minmax(150px,auto) 1fr;align-items:center;gap:7px;width:100%}.weekday-dungeon .day-rewards small{margin:0;color:var(--muted);font-size:12px}.cost-note{display:block!important;margin-top:6px!important;font-size:12px!important;color:var(--muted)!important}@media(max-width:640px){.weekday-dungeon .day-rewards span{grid-template-columns:48px minmax(0,1fr) auto;gap:5px}.weekday-dungeon .day-rewards span>small{grid-column:auto;font-size:11.5px}}

<body><main class="wrap">
<section class="hero"><div class="brand-logo"><img src="https://nxtw.dn.nexoncdn.co.kr/mbm/home/img/mmlogo.svg" alt="瑪奇 Mobile"></div></section>
<nav class="main-menu" aria-label="內容分類"><button class="menu-btn active" data-page="routine">每日待辦</button><button class="menu-btn" data-page="shopping">商店採購</button><button class="menu-btn" data-page="gold">快速採集</button></nav>
<section class="page-section" id="routinePage">
  <div class="todo-top"><div><h2>每日待辦</h2></div><button class="todo-clear" type="button" id="clearTodos">清除勾選</button></div>
  <div class="todo-list" id="dailyTodos">
    <label class="todo-item important"><input type="checkbox"><span class="todo-check"></span><span class="todo-main"><b>商城破碎的寶石箱</b><small>道具商店 → 金幣，每個 4,000 金幣。</small></span><span class="todo-tag">必買</span></label>
    <label class="todo-item important"><input type="checkbox"><span class="todo-check"></span><span class="todo-main"><b>商城每日免費商品</b><small>每天領取免費商品。</small></span><span class="todo-tag">先領</span></label>
    <label class="todo-item important"><input type="checkbox"><span class="todo-check"></span><span class="todo-main"><b>商城每日銀幣箱</b><small>每天可以用 120 德卡購買 10 個銀幣。</small></span><span class="todo-tag">必買</span></label>
    <label class="todo-item weekday-dungeon"><input type="checkbox"><span class="todo-check"></span><span class="todo-main"><b>週幾地下城</b><small>每天 1 次｜入口：每週任務／兼職｜週日可自選一個</small><span class="day-rewards"><span><i>一・四</i> <strong>💰 閃耀洞穴</strong><small>金幣</small></span><span><i>二・五</i> <strong>💎 璀璨宅邸</strong><small>寶石</small></span><span><i>三・六</i> <strong>🔥 燦爛遺跡</strong><small>煉金術／燃燒催化劑</small></span></span></span><span class="todo-tag">1 次</span></label>
    <label class="todo-item"><input type="checkbox"><span class="todo-check"></span><span class="todo-main"><b>黑色坑洞</b><small>每日限時高回報副本，拿養成資源與經驗。</small></span><span class="todo-tag">1 次</span></label>
    <label class="todo-item"><input type="checkbox"><span class="todo-check"></span><span class="todo-main"><b>兼職任務</b><small>每天更新，賺取聖水與愛心幣。</small></span><span class="todo-tag">每日</span></label>
    <label class="todo-item"><input type="checkbox"><span class="todo-check"></span><span class="todo-main"><b>深層地下城</b><small>中後期核心；消耗「魔族貢品」，刷高階養成素材。</small></span><span class="todo-tag">2 次</span></label>
    <label class="todo-item"><input type="checkbox"><span class="todo-check"></span><span class="todo-main"><b>不祥的召喚結界</b><small>每小時整點出現 → 約 :03 開始召喚怪物 → 約 :07 結界結束。</small><small>位置：狩獵場內出現；整點可從任務／地圖提示直接確認並移動。</small><small>主要掉落：秘術骰子鑰匙箱（用來取得秘術骰子鑰匙）、金幣等戰利品；每週戰利品 7 次，週一 06:00 重置。</small></span><span class="todo-tag">每小時</span></label>
  </div>

  <details class="weekly-box">
    <summary><span><b>每週待辦</b><small>有時間再清，不用每天全部看</small></span><span class="weekly-arrow">⌄</span></summary>
    <div class="weekly-list">
      <label class="todo-item"><input type="checkbox"><span class="todo-check"></span><span class="todo-main"><b>野外首領</b><small>每週 3 次，拿野外首領印章，可兌換指定位置的傳說符文。</small></span><span class="todo-tag">3 次</span></label>
      <label class="todo-item"><input type="checkbox"><span class="todo-check"></span><span class="todo-main"><b>深淵與團隊副本</b><small>每週重置通關戰利品次數；建議週末前清完。</small></span><span class="todo-tag">每週</span></label>
    </div>
  </details>
</section>
<section class="page-section" id="shoppingPage" hidden>

    <div class="gold-filters" id="goldFilters"></div>
    <div class="resultbar"><b id="goldTitle">全部快速採集</b><span id="goldCount"></span></div>

  </div>

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function norm(s){return String(s??'').toLowerCase().replace(/\s+/g,'')}
function hl(s){s=esc(s); if(!query.trim()) return s; const k=query.trim().replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); return s.replace(new RegExp(`(${k})`,'ig'),'<mark>$1</mark>')}
function init(){

 document.querySelector('#tabs').onclick=e=>{const b=e.target.closest('[data-map]');if(!b)return;activeMap=b.dataset.map;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()};

function filtered(){return DATA.filter(x=>{
 if(activeMap==='workbench'&&!x.workbench)return false;

})}

let activePage='routine', goldFilter='全部', goldQuery='';
function initPages(){
 document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{activePage=b.dataset.page;document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#routinePage').hidden=activePage!=='routine';document.querySelector('#shoppingPage').hidden=activePage!=='shopping';document.querySelector('#goldPage').hidden=activePage!=='gold'; if(activePage==='gold')renderGold();});
 const cats=['全部','黃金','其他'];
 document.querySelector('#goldFilters').innerHTML=cats.map((x,i)=>`<button class="gold-filter ${i===0?'active':''}" data-gold-filter="${esc(x)}">${x==='黃金'?'黃金素材':x}</button>`).join('');
 document.querySelector('#goldFilters').onclick=e=>{const b=e.target.closest('[data-gold-filter]');if(!b)return;goldFilter=b.dataset.goldFilter;document.querySelectorAll('.gold-filter').forEach(x=>x.classList.toggle('active',x===b));renderGold()};
 document.querySelector('#goldQ').addEventListener('input',e=>{goldQuery=e.target.value;renderGold()});
}
function renderGold(){
 const q=norm(goldQuery);let arr=GATHER_DATA.filter(x=>(goldFilter==='全部'||x.category===goldFilter)&&(!q||norm([x.name,x.type,x.keywords,x.steps.join(' '),x.use,x.tip].join(' ')).includes(q)));
 document.querySelector('#goldCount').textContent=`${arr.length} 項`;
 document.querySelector('#goldTitle').textContent=goldFilter==='全部'?'全部快速採集':goldFilter==='黃金'?'黃金素材':'其他素材';
 document.querySelector('#goldResults').innerHTML=arr.length?arr.map(x=>`<article class="gather-card"><header class="gather-head"><div class="gather-icon" aria-hidden="true">${x.icon}</div><div class="gather-title"><div class="gather-kind">${esc(x.type)}</div><div class="gather-name"><span class="gold-name">${esc(x.name)}</span>${x.keywords?`<span class="kw"> · ${esc(x.keywords)}</span>`:''}</div>${x.drops&&x.drops.length?`<div class="drop-row"><span class="drop-label">一般副產物</span>${x.drops.map(v=>`<span class="drop-tag">${esc(v)}</span>`).join('')}</div>`:''}</div><span class="gather-cat ${x.category==='其他'?'other':''}">${esc(x.category)}</span></header><div class="gather-body"><div class="method-label">快速找法／採集方法</div><div class="method steps">${x.steps.map((v,i)=>`${i?'<span class="arrow">›</span>':''}<span class="step">${esc(v)}</span>`).join('')}</div>${x.use?`<div class="gather-use"><b>主要用途：</b>${esc(x.use)}</div>`:''}${x.tip?`<div class="gather-tip">${esc(x.tip)}</div>`:''}</div></article>`).join(''):'<div class="gold-empty">找不到符合的素材。</div>';
}
